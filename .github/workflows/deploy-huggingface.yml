# Deploys the site to a free Hugging Face Space on every push to main.
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   Secret   HF_TOKEN  = a Hugging Face access token with "Write" permission
#   Variable HF_SPACE  = your Space, e.g. "your-hf-username/textsnap"
# Until HF_SPACE is set, this workflow does nothing.
name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-huggingface
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Add the HF_TOKEN secret first"; exit 1; fi
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
